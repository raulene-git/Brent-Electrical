<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brent Electrical — Coming Soon</title>
<meta name="description" content="Brent Electrical — NAPIT registered electricians serving Oxford, Oxfordshire and the Cotswolds. Website coming soon." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:   #05101e;
    --navy-2: #0a1a2e;
    --ember:  #ef6a2a;
    --blue:   #5bb4d6;
    --ink-1:  #f0f4f8;
    --ink-3:  #7a92a8;
    --line:   rgba(255,255,255,0.08);
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--navy);
    color: var(--ink-1);
    font-family: 'Inter Tight', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }

  /* Subtle background glow */
  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: -20%;
    width: 70vw;
    height: 70vw;
    background: radial-gradient(ellipse, rgba(61,155,201,0.07) 0%, transparent 65%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -20%;
    right: -10%;
    width: 50vw;
    height: 50vw;
    background: radial-gradient(ellipse, rgba(239,106,42,0.06) 0%, transparent 65%);
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 600px;
    width: 100%;
  }

  /* Eyebrow */
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 1.5rem;
    padding-top: 1rem;
  }
  .eyebrow::before {
    content: '';
    display: block;
    width: 28px;
    height: 1px;
    background: var(--ember);
  }

  /* Headline */
  h1 {
    font-family: 'GFS Didot', Georgia, serif;
    font-weight: 400;
    font-size: clamp(2.4rem, 7vw, 4.5rem);
    line-height: 1.08;
    letter-spacing: -0.01em;
    color: var(--ink-1);
    margin-bottom: 1.5rem;
  }
  h1 em {
    font-style: italic;
    color: var(--ember);
  }

  /* Subtext */
  .sub {
    font-size: 1rem;
    line-height: 1.65;
    color: var(--ink-3);
    max-width: 44ch;
    margin: 0 auto 2.5rem;
  }

  /* Divider */
  .divider {
    width: 48px;
    height: 1px;
    background: var(--line);
    margin: 0 auto 2.5rem;
  }

  /* Contact row */
  .contacts {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }
  .contact-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.92rem;
    color: var(--ink-3);
    text-decoration: none;
    transition: color 0.3s ease;
  }
  .contact-item:hover { color: var(--ink-1); }
  .contact-item svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    color: var(--blue);
  }

  /* NAPIT badge */
  .badge {
    margin-top: 3rem;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 1rem 0.5rem 0.6rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .badge-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ember);
    flex-shrink: 0;
  }

  @media (max-width: 480px) {
    h1 { font-size: clamp(2rem, 10vw, 2.8rem); }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Eyebrow -->
  <div class="eyebrow">Something better is on its way</div>

  <!-- Headline -->
  <h1>Under<br/><em>construction.</em></h1>

  <!-- Sub -->
  <p class="sub">
    We're putting the finishing touches on our new site. In the meantime, we're still fully operational — get in touch directly.
  </p>

  <div class="divider"></div>

  <!-- Contact -->
  <div class="contacts">
    <a href="tel:07958313181" class="contact-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
      </svg>
      07958 313 181
    </a>
    <a href="mailto:info@brentelectrical.com" class="contact-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6c0-1.1.9-2 2-2z"/>
        <path d="M22 6l-10 7L2 6"/>
      </svg>
      info@brentelectrical.com
    </a>
    <div class="contact-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      Oxford, Oxfordshire &amp; the Cotswolds
    </div>
  </div>

  <!-- Badge -->
  <div class="badge">
    <div class="badge-dot"></div>
    NAPIT Registered · Part P Compliant
  </div>

</div>
</body>
</html>
